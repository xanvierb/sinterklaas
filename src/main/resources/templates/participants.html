<!doctype html>
<html lang="nl-NL" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Familie', ~{::article})}">
<article>
    <h1>Familie</h1>
    <div class="participant-grid">
        <a th:each="person : ${participants}" class="surface participant-card"
           th:href="@{/deelnemers/{id}/wensen(id=${person.id})}">
            <img th:if="${person.hasAvatar}" class="avatar" th:src="@{/deelnemers/{id}/foto(id=${person.id})}" alt="">
            <span th:unless="${person.hasAvatar}" class="avatar avatar-placeholder" aria-hidden="true"
                  th:text="${#strings.substring(person.displayName, 0, 1)}"></span>
            <span class="participant-details">
                <strong th:text="${person.displayName}"></strong>
                <small th:if="${person.chocolateFlavor != null}"
                       th:text="|Chocoladeletter: ${person.chocolateFlavor.label}|"></small>
            </span>
            <svg th:if="${person.chocolateFlavor != null}" th:attr="data-flavor=${person.chocolateFlavor.name()}"
                 class="chocolate-letter" viewBox="0 0 64 64" aria-hidden="true">
                <defs th:if="${person.chocolateFlavor.name() == 'HAZELNOOT'}">
                    <pattern th:id="|chocolate-nuts-${person.id}|" width="10" height="10" patternUnits="userSpaceOnUse">
                        <rect width="10" height="10" class="chocolate-nut-base"/>
                        <circle cx="3" cy="4" r="1.5" class="chocolate-nuts"/>
                        <circle cx="8" cy="8" r="1" class="chocolate-nuts"/>
                    </pattern>
                </defs>
                <text x="32" y="51" text-anchor="middle" class="chocolate-glyph"
                      th:attr="fill=${person.chocolateFlavor.name() == 'HAZELNOOT'} ? |url(#chocolate-nuts-${person.id})| : null"
                      th:text="${#strings.toUpperCase(#strings.substring(person.displayName, 0, 1))}">S</text>
            </svg>
        </a>
    </div>
    <p th:if="${participants.isEmpty()}" class="surface">Er zijn nog geen deelnemers. Vraag de beheerder om uitnodigingen te versturen.</p>
</article>
</html>
