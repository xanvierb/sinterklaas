<!doctype html>
<html lang="nl-NL" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="errors" th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert">
    <p class="mb-1 fw-semibold">Controleer je invoer.</p>
    <ul class="mb-0">
        <li th:each="error : ${#fields.detailedErrors()}" th:text="${error.message}"></li>
    </ul>
</div>
<div th:fragment="identity" class="fields">
    <div>
        <label for="username" class="form-label">Gebruikersnaam</label>
        <input class="form-control" th:field="*{username}" th:errorclass="is-invalid" maxlength="32" minlength="3"
               pattern="[a-zA-Z0-9][a-zA-Z0-9._\-]{2,31}" autocomplete="username" required>
    </div>
    <th:block th:replace="~{fields :: displayNameField}"></th:block>
</div>
<div th:fragment="displayNameField">
    <label for="displayName" class="form-label">Weergavenaam</label>
    <input class="form-control" th:field="*{displayName}" th:errorclass="is-invalid" maxlength="80" required>
</div>
<div th:fragment="newPassword" class="fields">
    <div>
        <label for="password" class="form-label">Nieuw wachtwoord</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="new-password"
               minlength="8" maxlength="72" aria-describedby="passwordHelp" required>
        <div id="passwordHelp" class="form-text">Gebruik minimaal 8 tekens. Het wachtwoord mag maximaal 72 bytes bevatten.</div>
    </div>
    <div>
        <label for="confirmation" class="form-label">Herhaal het nieuwe wachtwoord</label>
        <input id="confirmation" name="confirmation" type="password" class="form-control" autocomplete="new-password"
               minlength="8" maxlength="72" required>
    </div>
</div>
<div th:fragment="adminNav" th:if="${viewer != null and viewer.role.name() == 'ADMIN'}" class="mb-4 d-print-none">
    <nav aria-label="Beheer" class="admin-nav">
        <details class="nav-group" name="admin-nav">
            <summary>Deelnemers</summary>
            <div class="nav-panel">
                <a th:href="@{/beheer}">Accounts</a>
                <a th:href="@{/beheer/uitnodigingen}">Uitnodigingen</a>
            </div>
        </details>
        <details class="nav-group" name="admin-nav">
            <summary>Pakjesavond</summary>
            <div class="nav-panel">
                <a th:href="@{/beheer/pakjesavond}">Datum van pakjesavond</a>
                <a th:href="@{/beheer/afspraken}">Groepsafspraken</a>
                <a th:href="@{/beheer/lootjes}">Lootjes</a>
            </div>
        </details>
        <a th:href="@{/beheer/cadeaus}">Reserveringen</a>
    </nav>
</div>
</body>
</html>
