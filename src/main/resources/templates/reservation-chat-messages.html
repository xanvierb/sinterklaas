<div xmlns:th="http://www.thymeleaf.org" th:fragment="messages" id="chat-messages" class="chat-messages" aria-label="Berichten" role="log" tabindex="0"
             th:attr="hx-get=@{/reserveringen/{id}/chat/berichten(id=${chat.wishId})}"
             hx-trigger="every 3s" hx-select=".chat-poll-item" hx-swap="innerHTML">
    <th:block th:replace="~{reservation-chat-messages :: items}"></th:block>
</div>
<th:block th:fragment="items">
    <p class="chat-poll-item" th:if="${chat.messages.isEmpty()}">Stuur een bericht om het gesprek te beginnen.</p>
    <div th:each="entry : ${chat.messages}" class="chat-message-row chat-poll-item"
         th:classappend="${entry.sameSide} ? 'chat-message-mine' : ''">
        <th:block th:unless="${entry.sameSide}">
            <span th:replace="~{chat-avatar :: avatar(${chat})}"></span>
        </th:block>
        <span th:if="${entry.mine}" class="chat-avatar" aria-hidden="true">
            <img th:if="${viewer.person.hasAvatar}"
                 th:src="@{/deelnemers/{id}/foto(id=${viewer.person.id})}" alt="">
            <span th:unless="${viewer.person.hasAvatar}"
                  th:text="${#strings.toUpperCase(#strings.substring(viewer.person.displayName, 0, 1))}"></span>
        </span>
        <span th:if="${entry.sameSide and !entry.mine}" class="chat-avatar" aria-hidden="true">O</span>
        <div class="chat-bubble" th:classappend="${entry.sameSide} ? 'chat-mine' : 'chat-theirs'">
            <small th:text="${entry.mine ? 'Jij' : (entry.sameSide ? 'Andere ouder' : chat.otherName)}"></small>
            <p th:text="${entry.body}"></p>
            <time class="chat-time" th:datetime="${entry.sentAt}" th:text="${entry.sentAtLabel}"></time>
        </div>
    </div>
</th:block>
