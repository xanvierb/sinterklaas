name: Publish Sinterklaas image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: |
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME repository variable}"
          docker build --tag "$DOCKERHUB_USERNAME/sinterklaas:$IMAGE_TAG" .

      - name: Push image to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN repository secret}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker push "$DOCKERHUB_USERNAME/sinterklaas:$IMAGE_TAG"
