services:
  app:
    build: .
    image: ${SINT_IMAGE:-sinterklaas:local}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SINT_DB_URL: jdbc:postgresql://db:5432/sinterklaas
      SINT_DB_USER: ${SINT_DB_USER:-sinterklaas}
      SINT_DB_PASSWORD: ${SINT_DB_PASSWORD:?Set SINT_DB_PASSWORD}
      SINT_ADMIN_USERNAME: ${SINT_ADMIN_USERNAME:-}
      SINT_ADMIN_PASSWORD: ${SINT_ADMIN_PASSWORD:-}
      SINT_BASE_URL: ${SINT_BASE_URL:-http://localhost:8080}
      SINT_SECURE_COOKIES: ${SINT_SECURE_COOKIES:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sinterklaas
      POSTGRES_USER: ${SINT_DB_USER:-sinterklaas}
      POSTGRES_PASSWORD: ${SINT_DB_PASSWORD:?Set SINT_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  database:
  uploads:
